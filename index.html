<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030d1a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="J.A.R.V.I.S."><title>J.A.R.V.I.S. MARK V</title><style>
:root{color-scheme:dark;--cyan:#60e4ff;--blue:#159bd8;--muted:#77a9c2}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 33%,#0b3153 0%,#041629 38%,#020813 77%);color:#d9f8ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 4px,#75d9ff05 5px 6px);z-index:3}.wrap{max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 30px);min-height:100dvh;display:flex;flex-direction:column;gap:18px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2b739459;padding-bottom:15px}.brand{font-size:22px;letter-spacing:5px;font-weight:750;text-shadow:0 0 16px #49d8ff8a}.sub{font-size:9px;letter-spacing:2.4px;color:var(--muted);margin-top:5px}.online{font-size:10px;color:#83f7d1;letter-spacing:1px;display:flex;align-items:center;gap:6px}.dot{width:6px;height:6px;border-radius:50%;background:#83f7d1;box-shadow:0 0 12px #83f7d1}.core{position:relative;width:min(86vw,370px);height:min(86vw,370px);margin:5px auto;display:grid;place-items:center;isolation:isolate}.core:before{content:"";position:absolute;inset:0;border:1px solid #286d94;border-radius:50%;box-shadow:0 0 35px #2abfff19,inset 0 0 35px #2abfff0b}.ring{position:absolute;border-radius:50%;border-style:solid;animation:spin 24s linear infinite}.r1{inset:7%;border-width:3px;border-color:#63e4ff transparent #63e4ff transparent;filter:drop-shadow(0 0 6px #5de4ff)}.r2{inset:16%;border-width:2px;border-color:#12608c #5bdcff #12608c #5bdcff;animation-duration:18s;animation-direction:reverse}.r3{inset:24%;border-width:5px;border-color:#58dbff transparent #58dbff transparent;animation-duration:13s}.ticks{position:absolute;inset:1%;border-radius:50%;background:repeating-conic-gradient(from 0deg,#4ccfff 0deg 1deg,transparent 1deg 8deg);mask:radial-gradient(transparent 68%,black 69% 70%,transparent 71%);opacity:.65;animation:spin 70s linear infinite}.orb{width:33%;height:33%;border-radius:50%;background:radial-gradient(circle at 43% 38%,#e8ffff,#79eaff 20%,#1e9dce 48%,#072949 72%);box-shadow:0 0 25px #51e3ff,0 0 85px #28cfff6c,inset 0 0 30px #c8ffff8c;animation:pulse 3s ease-in-out infinite;display:grid;place-items:center;z-index:1}.orb span{font-size:11px;font-weight:800;letter-spacing:2px;color:#03334b;text-shadow:0 1px #fff7}.cross{position:absolute;background:#4ed6ff77}.h{width:100%;height:1px}.v{height:100%;width:1px}.core-caption{text-align:center;margin-top:-5px;font-size:10px;letter-spacing:3px;color:#6fbedf}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{background:#061d30bf;border:1px solid #2c77935e;border-radius:10px;padding:12px 9px;text-align:center}.tile strong{display:block;font-size:12px;letter-spacing:.7px}.tile small{display:block;font-size:9px;color:#6eaecb;margin-top:6px;letter-spacing:.5px}.actions{display:grid;gap:10px}button{font:inherit;cursor:pointer}.primary{width:100%;border:1px solid #7deaff;border-radius:12px;padding:17px 12px;color:#002b43;background:linear-gradient(135deg,#9df3ff,#32c8ef);font-weight:800;letter-spacing:1.5px;box-shadow:0 0 28px #3ecfff4b}.secondary{width:100%;border:1px solid #317a9a;border-radius:11px;padding:14px;background:#08243b;color:#bdeeff;letter-spacing:.8px;font-weight:650}.secondary.active{border-color:#8cf9d6;color:#8cf9d6}.meter{height:52px;border:1px solid #245b77;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:3px;padding:8px;background:#061727}.bar{width:4px;height:5px;border-radius:4px;background:linear-gradient(#baf7ff,#19a9dc);box-shadow:0 0 7px #32c9faaa;transition:height .07s}.footer{margin-top:auto;display:flex;justify-content:space-between;gap:10px;color:#538ba9;font-size:9px;letter-spacing:1px}.message{min-height:18px;color:#8fd8f3;font-size:11px;text-align:center;line-height:1.4}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 40px #79edff,0 0 100px #28cfff90,inset 0 0 35px #efffff}}@media(prefers-reduced-motion:reduce){.ring,.ticks,.orb{animation:none}} </style></head><body><main class="wrap"><header class="top"><div><div class="brand">J.A.R.V.I.S.</div><div class="sub">MARK V · HOLOGRAPHIC INTERFACE</div></div><div class="online"><i class="dot"></i> ONLINE</div></header><section aria-label="Animerad holografisk AI-kärna"><div class="core"><div class="ticks"></div><div class="cross h"></div><div class="cross v"></div><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="orb"><span>JARVIS</span></div></div><div class="core-caption">VOICE INTERFACE · READY</div></section><section class="status"><div class="tile"><strong id="clock">--:--</strong><small>LOCAL TIME</small></div><div class="tile"><strong>ACTIVE</strong><small>AI LINK</small></div><div class="tile"><strong id="micstatus">STANDBY</strong><small>MIC SENSOR</small></div></section><section class="actions"><button class="primary" id="launch">◉ AKTIVERA JARVIS</button><button class="secondary" id="mic">◌ STARTA RÖSTVISUALISERING</button><div class="meter" id="meter" aria-label="Ljudnivåvisualisering"></div><button class="secondary" id="sound">♪ SPELA UPPSTARTSLJUD</button><div class="message" id="message" role="status">System redo. Tryck för att aktivera.</div></section><footer class="footer"><span>STARK INDUSTRIES · PERSONAL INTERFACE</span><span>MARK V / 05</span></footer></main><script>
const $=id=>document.getElementById(id),bars=[];for(let i=0;i<35;i++){let b=document.createElement('div');b.className='bar';$('meter').appendChild(b);bars.push(b)}function status(s){$('message').textContent=s}function clock(){ $('clock').textContent=new Date().toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,30000);
$('launch').onclick=()=>{status('Öppnar genvägen JARVIS …');sound(false);window.location.href='shortcuts://run-shortcut?name=JARVIS'};
let ctx,analyser,stream,source,frame,listening=false;function draw(){if(!listening)return;let values=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(values);bars.forEach((b,i)=>{let idx=Math.floor(i/bars.length*values.length*.65);let v=values[idx]/255;b.style.height=(5+v*35)+'px'});frame=requestAnimationFrame(draw)}async function stopMic(){listening=false;cancelAnimationFrame(frame);if(stream)stream.getTracks().forEach(t=>t.stop());if(source)source.disconnect();if(ctx)await ctx.close();stream=null;source=null;ctx=null;bars.forEach(b=>b.style.height='5px');$('mic').classList.remove('active');$('mic').textContent='◌ STARTA RÖSTVISUALISERING';$('micstatus').textContent='STANDBY';status('Mikrofonvisualisering avstängd.')} $('mic').onclick=async()=>{if(listening){await stopMic();return}if(!navigator.mediaDevices?.getUserMedia){status('Mikrofonen kräver HTTPS och en kompatibel webbläsare.');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new (window.AudioContext||window.webkitAudioContext)();source=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=256;source.connect(analyser);listening=true;$('mic').classList.add('active');$('mic').textContent='■ STOPPA RÖSTVISUALISERING';$('micstatus').textContent='LISTENING';status('Ljudstaplarna reagerar på mikrofonen. Ingen inspelning sparas eller skickas.');draw()}catch(e){status('Mikrofonåtkomst nekades eller kunde inte startas.');if(stream)stream.getTracks().forEach(t=>t.stop())}};
function sound(show=true){try{let ac=new(window.AudioContext||window.webkitAudioContext)();[440,660,880].forEach((freq,i)=>{let osc=ac.createOscillator(),gain=ac.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,ac.currentTime+i*.11);gain.gain.setValueAtTime(.0001,ac.currentTime+i*.11);gain.gain.exponentialRampToValueAtTime(.045,ac.currentTime+i*.11+.02);gain.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+i*.11+.21);osc.connect(gain);gain.connect(ac.destination);osc.start(ac.currentTime+i*.11);osc.stop(ac.currentTime+i*.11+.23)});setTimeout(()=>ac.close(),900);if(show)status('Uppstartsljud spelat. Systems operational.')}catch(e){if(show)status('Ljud kunde inte spelas i denna webbläsare.')}}$('sound').onclick=()=>sound(true);
</script></body></html>
